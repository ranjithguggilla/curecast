[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curecast"
version = "0.1.0"
description = "Compressive-strength prediction and low-clinker mix optimisation for concrete"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranjith Guggilla", email = "ranjithguggilla668@gmail.com" }]
keywords = ["concrete", "regression", "sustainability", "scikit-learn", "mix-design"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pingouin>=0.5",
    "yellowbrick>=1.5",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "gradio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
curecast-train = "curecast.train:main"
curecast-app = "curecast.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E402"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
